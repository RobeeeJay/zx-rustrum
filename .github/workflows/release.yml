name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Build every platform, without waiting for a version bump"
        type: boolean
        default: false

# A pull request that has been pushed to again is not worth finishing: only
# its newest commit is going to be merged.
#
# A run on main is never cancelled, though it shares the group. Runs here are
# created minutes after the push that asks for them — six, sixteen and
# twenty-one minutes in one afternoon — and they arrive out of order, so
# cancelling whatever is running in favour of whatever has just been queued
# killed a nearly finished run of the newest commit for a run of an older one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is for a machine that keeps its target directory
  # between builds. CI does not, and the artefacts only make the cache larger.
  CARGO_INCREMENTAL: 0

jobs:
  # What is being built, on what, and whether it is a release.
  #
  # A commit on main is released when the version in Cargo.toml has not been
  # released before, so cutting a release is bumping that version: the tag and
  # the release are made from the commit that changed it.
  #
  # A full run is seven jobs, three of them on macOS, and took 29 minutes for
  # 1.2.0, so an ordinary push is tested on Linux and nothing else, and the
  # other two platforms and the packaging run when there is something to
  # release: a version bump, a tag, or a workflow_dispatch asking for it. A
  # push that only touches prose is not built at all.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
      full: ${{ steps.read.outputs.full }}
      build: ${{ steps.read.outputs.build }}
      oses: ${{ steps.read.outputs.oses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A tag says what it is; the version in Cargo.toml is only checked
            # against it, since a release built from a mismatched tree would
            # report a version it is not.
            version="${GITHUB_REF#refs/tags/v}"
            in_manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            if [ "$version" != "$in_manifest" ]; then
              echo "tag v$version against Cargo.toml $in_manifest" >&2
              exit 1
            fi
            release=true
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            release=false
            # A hand-started run counts as well as a push, so a release can
            # be cut without one — a re-run after a cancelled job, say. The
            # gate is the same either way: a run releases only when the
            # version in Cargo.toml has no tag, so the two cannot both publish
            # the same version, and a push arriving while a hand-started run
            # is going cancels it through the concurrency group above.
            if [ "$GITHUB_REF" = refs/heads/main ] &&
               { [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; }; then
              if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
                echo "v$version is already released; bump the version in Cargo.toml to cut another"
              else
                release=true
              fi
            fi
          fi

          # Everything is built when there is a release in it, or when a tag or
          # a hand-started run asks for it; otherwise Linux alone.
          full=false
          if [ "$release" = true ] || [ "${{ inputs.full }}" = true ]; then
            full=true
          fi
          if [ "$full" = true ]; then
            oses='["ubuntu-latest", "macos-latest", "windows-latest"]'
          else
            oses='["ubuntu-latest"]'
          fi

          # A commit that only changes prose builds nothing. The comparison is
          # against what was on main before the push; a first push, or a tag,
          # has nothing to compare against and is built.
          build=true
          before="${{ github.event.before }}"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] &&
             [ -n "$before" ] && [ "$before" != 0000000000000000000000000000000000000000 ] &&
             git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$before" "$GITHUB_SHA")"
            if [ -n "$changed" ] && ! grep -qvE '(\.md$|^docs/|^designs/|^prompts/)' <<<"$changed"; then
              build=false
              echo "prose only, nothing to build:"
              echo "$changed"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "oses=$oses" >> "$GITHUB_OUTPUT"
          echo "version $version, release $release, full $full, build $build, on $oses"

  # The tests that need a ROM or a tape skip themselves when the file is not
  # there, so the suite is meaningful on CI even though roms/ and tapes/ are
  # not in the repository.
  test:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.version.outputs.oses) }}
    runs-on: ${{ matrix.os }}
    env:
      # The tests are not the thing that ships, so they are built without
      # link-time optimisation: it is thin LTO over fifty-odd test binaries,
      # and it is the bulk of the build. The packaging job below keeps the
      # release profile as it stands.
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # cpal links against ALSA, rfd talks to the desktop portal, and gilrs
      # finds gamepads through udev — without libudev-dev its build script
      # cannot find the library and nothing on Linux builds.
      - name: Install Linux audio, dialog and gamepad libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      # Formatting and lints are the same answer on every platform, and
      # clippy is a second full build of everything. They run on the cheap
      # runner only; what the other two are here for is the tests.
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo test --release

  package:
    needs: [version, test]
    if: needs.version.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Whether the signing secrets are there, as a word: a secret cannot be
      # tested in a step's `if` directly, and this says no more than that.
      HAVE_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio and dialog libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      # The disk image is named for the version and the architecture by the
      # script itself, so the two macOS builds do not land on one file.
      # The Developer ID certificate goes into a keychain of its own for the
      # run, the notary key into a file, and both are taken away again below.
      # Without the secrets nothing is put anywhere and the app is built
      # unsigned — unless this is a release, which the packaging script
      # refuses to build unsigned.
      - name: Put the signing certificate and notary key in place
        if: runner.os == 'macOS' && env.HAVE_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_TEXT: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "MACOS_CERTIFICATE holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "signing as $identity"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s\n' "$MACOS_NOTARY_KEY_TEXT" > "$RUNNER_TEMP/notary.p8"
          echo "MACOS_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build the app bundle
        if: runner.os == 'macOS'
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          MACOS_REQUIRE_SIGNED: ${{ needs.version.outputs.release }}
        # The image is moved up beside the archives. An artifact keeps the
        # paths of what went into it, and with the image left under
        # target/packaging it came back down under that path too — where the
        # release job's `*.dmg` did not match it, and the 1.0.0 release went
        # out with two files instead of four.
        run: |
          packaging/macos-app.sh ${{ matrix.target }}
          mv target/packaging/*.dmg .

      - name: Take the signing certificate and notary key away
        if: always() && runner.os == 'macOS' && env.HAVE_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      # Everything but macOS ships as a plain archive: the binary, the ROM
      # directory it searches, and the licence.
      - name: Stage the archive
        if: runner.os != 'macOS'
        shell: bash
        run: |
          out="zx-rustrum-$VERSION-${{ matrix.name }}"
          mkdir -p "$out/roms"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/zx-rustrum.exe" "$out/"
          else
            cp "target/${{ matrix.target }}/release/zx-rustrum" "$out/"
          fi
          cp README.md "$out/"
          cat > "$out/roms/README.txt" <<'TXT'
          Put ROM images here: 48.rom (16K), 128.rom (32K), plus3.rom (64K),
          zx81.rom (8K). None are included: they are still under copyright.
          TXT
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$out.zip" "$out"
          else
            tar czf "$out.tar.gz" "$out"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            zx-rustrum-*.tar.gz
            zx-rustrum-*.zip
            ZX-Rustrum-*.dmg
          if-no-files-found: error
          # These are a step on the way to the release, which keeps its own
          # copy: a fortnight is long enough to fetch one by hand, and there
          # is no point keeping forty-odd megabytes a run for ninety days.
          retention-days: 14

  release:
    needs: [version, package]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # The tag is made here when the push was to main: the release and the
      # tag then name the same commit, and there is nothing to remember to
      # push afterwards.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          # The commit this run built, rather than wherever the branch has got
          # to: runs are created minutes after their push, so by the time one
          # reaches here the branch may have moved on, and a tag on a commit
          # whose binaries these are not is a lie about what was released.
          target_commitish: ${{ github.sha }}
          name: ZX-Rustrum ${{ needs.version.outputs.version }}
          files: |
            *.tar.gz
            *.zip
            *.dmg
          body: |
            ZX-Rustrum ${{ needs.version.outputs.version }}, built from
            ${{ github.sha }}: macOS (Apple silicon and Intel), Linux x86-64
            and Windows x86-64.

            No ROM images are included — they are still under copyright. Put
            yours next to the binary (or in `roms/`), or open one with
            File ▸ Load ROM…

            The macOS builds are signed with a Developer ID and notarised by
            Apple, so they open like any other app downloaded from the web.
