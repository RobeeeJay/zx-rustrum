[package]
name = "zx-rustrum"
version = "1.1.0"
edition = "2021"
default-run = "zx-rustrum"

[dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    # wgpu rather than glow: on macOS the OpenGL path goes through glutin,
    # which panics ("context to have a current view") when a viewport's window
    # loses its view. wgpu uses Metal there and has no such path.
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.35"
rfd = "0.15"
# Already in the lock file by way of eframe; used to read the window icon.
png = "0.18"
cpal = "0.18"
# Already in the lock file by way of the image crates; RZX blocks are
# deflated and there is no network to fetch anything else with.
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gilrs = "0.11.2"
# Training a network to play games (src/training/). Allowed in by the user's
# decision on 14 September 2026 — see CLAUDE.md. The GPU backend uses the same
# wgpu 29 as eframe; ndarray is the CPU backend the tests train on.
burn = { version = "0.21", default-features = false, features = [
    "std",
    "autodiff",
    "ndarray",
    "wgpu",
] }
# burn takes its CPU backend with that crate's own defaults turned off, which
# leaves it on one core with no SIMD; named here so its threads and SIMD are
# on. The same crate and version burn already uses — part of the burn
# decision, not a crate of its own.
burn-ndarray = { version = "0.21", default-features = false, features = [
    "std",
    "simd",
    "multi-threads",
] }

[profile.dev]
opt-level = 1
# No debug information. On macOS it is left in the object files rather than
# the binary, so Cargo keeps every object of every test program it builds,
# under new names at every rebuild, and never deletes the old ones: a few
# weeks of test runs left 236,000 of them, 36 GB. Measured over a full build
# of the tests and three one-line edits, full debug information came to 9 GB
# and grew with each edit, line tables alone to 7.2 GB and grew by 2,800
# objects an edit, and none came to 5.7 GB and stopped at 6.9 GB after the
# first edit. A failing test still says where it failed; what is lost is
# file and line in a RUST_BACKTRACE stack.
debug = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
egui_kittest = "0.35"
